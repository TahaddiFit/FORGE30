    function WorkoutPlayer({ workout, onClose, onComplete }) {
      const [seconds, setSeconds] = useState(0);
      const [isActive, setIsActive] = useState(false);

      useEffect(() => {
        let interval = null;
        if (isActive) {
          interval = setInterval(() => {
            setSeconds((prev) => prev + 1);
          }, 1000);
        } else if (!isActive && seconds !== 0) {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isActive, seconds]);

      const formatTime = (totalSec) => {
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      return (
        <div className="fixed inset-0 z-50 bg-brand-black/95 backdrop-blur-md flex flex-col justify-between p-4 sm:p-8 overflow-y-auto">
          <div className="flex justify-between items-center border-b border-brand-border pb-4 max-w-4xl mx-auto w-full">
            <div>
              <span className="text-xs text-brand-accent font-bold uppercase">Day {workout.day} Guided Session</span>
              <h2 className="text-xl sm:text-2xl font-bold font-display">{workout.title}</h2>
            </div>
            <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl font-bold">✕</button>
          </div>

          <div className="max-w-3xl mx-auto w-full py-8 space-y-8">
            <div className="bg-brand-card border border-brand-border rounded-xl p-6 text-center shadow-2xl">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">Elapsed Session Time</span>
              <div className="text-5xl sm:text-6xl font-display font-bold text-brand-accent my-2 tracking-wider">
                {formatTime(seconds)}
              </div>
              <div className="flex justify-center gap-4 mt-4">
                <button
                  onClick={() => setIsActive(!isActive)}
                  className={`px-6 py-2.5 rounded font-bold uppercase text-xs ${
                    isActive ? 'bg-amber-600 hover:bg-amber-700' : 'bg-brand-accent hover:bg-brand-accentHover'
                  } text-white transition`}
                >
                  {isActive ? 'Pause Timer' : 'Start Timer'}
                </button>
                <button
                  onClick={() => { setIsActive(false); setSeconds(0); }}
                  className="px-4 py-2.5 border border-brand-border text-slate-400 hover:text-white rounded font-bold uppercase text-xs transition"
                >
                  Reset
                </button>
              </div>
            </div>

            <div className="space-y-4">
              <h3 className="text-lg font-bold uppercase font-display text-slate-300">Exercise Circuit Protocol</h3>
              {workout.exercises.map((ex, idx) => (
                <div key={idx} className="bg-brand-card border border-brand-border rounded-lg p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:border-slate-700 transition">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-brand-accent">0{idx + 1}</span>
                      <h4 className="font-bold text-white text-base">{ex.name}</h4>
                    </div>
                    <p className="text-slate-400 text-xs mt-1">{ex.instructions}</p>
                  </div>
                  <div className="flex items-center gap-3 text-xs bg-brand-black px-3 py-2 rounded border border-brand-border self-end sm:self-auto shrink-0">
                    <span className="text-slate-300 font-bold">{ex.sets} Sets</span>
                    <span className="text-slate-600">|</span>
                    <span className="text-brand-accent font-bold">{ex.reps}</span>
                  </div>
                </div>
              ))}

    // UPGRADED FEATURED AI ASSISTANT: Comprehensive Fitness Knowledge Base
    function AIAssistant() {
      const [messages, setMessages] = useState([
        { 
          role: 'system', 
          text: '🔥 Welcome to FORGE30 Universal AI Fitness Coach! Ask me ANYTHING regarding training techniques, fat loss, hypertrophy, high-protein nutrition, recovery, warm-ups, or custom exercise modifications. How can I assist your goals today?'

      ]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      const quickPrompts = [

        "How can I scale push-ups if I'm a total beginner?",
        "What are the best high-protein meals for busy schedules?",
        "How do I break a workout plateau with bodyweight training?",
        "Should I train if I am experiencing muscle soreness?"

      const scrollToBottom = () => {

      };

      useEffect(() => {

          return "🔥 FAT LOSS PROTOCOL:\n1. Caloric Deficit: Consume 300-500 kcal below your total daily energy expenditure (TDEE).\n2. Protein Intake: Maintain 1.6g - 2.2g of protein per kg of bodyweight to preserve muscle mass.\n3. High-Intensity Circuits: Execute 15-minute high-density workouts (like FORGE30) to boost post-exercise oxygen consumption (EPOC).\n4. Hydration: Drink 3-4 liters of water daily to maintain metabolic efficiency.";
        }

        // Muscle Building & Hypertrophy
        if (lower.includes('muscle') || lower.includes('hypertrophy') || lower.includes('build') || lower.includes('mass') || lower.includes('bulk')) {
          return "💪 HYPERTROPHY & MUSCLE BUILDING:\n1. Mechanical Tension: Focus on slow, controlled eccentric (lowering) phases (3-4 seconds per rep).\n2. Progressive Overload: Increase reps, decrease rest periods, or elevate leverage difficulty weekly.\n3. Proximity to Failure: Ensure your sets finish within 1-2 reps of technical failure.\n4. Caloric Surplus / Maintenance: Consume sufficient protein (minimum 1.8g/kg) and stay at or slightly above baseline calories.";
        }

        // Push-Ups & Scaling
        if (lower.includes('pushup') || lower.includes('push-up') || lower.includes('chest') || lower.includes('tricep')) {
          return "🎯 PUSH-UP MASTERCLASS:\n• Beginner Regression: Wall Push-ups ➔ Incline Push-ups (hands on bench/desk) ➔ Knee Push-ups.\n• Advanced Progression: Decline Push-ups (feet elevated) ➔ Diamond Push-ups ➔ Archer Push-ups.\n• Form Cues: Pack shoulders down, brace core tight, and flare elbows no more than 45 degrees relative to your torso.";
        }

        // Squats & Knee Care
        if (lower.includes('squat') || lower.includes('knee') || lower.includes('leg') || lower.includes('quad') || lower.includes('glute')) {
          return "🦵 LOWER BODY ENGINE & KNEE PRESERVATION:\n• Proper Squat Mechanics: Sit back into your hips, keep weight distributed through heels/midfoot, and drive knees outward inline with toes.\n• Knee Pain Relief: If knees hurt, substitute with Glute Bridges, Reverse Lunges, or Bulgarian Split Squats with a forward torso lean.\n• Progressive Load: Pause for 2 seconds at the bottom of bodyweight squats to multiply glute and quad tension.";
        }

        // Core, Abs, & Planks
        if (lower.includes('abs') || lower.includes('core') || lower.includes('plank') || lower.includes('belly')) {
          return "🛡 CORE STABILITY & VISIBLE ABS:\n1. Abs are revealed in the kitchen through systematic fat loss.\n2. For structural core strength: Maintain pelvic tilt during planks (squeeze glutes, tuck belly button to spine).\n3. Effective Exercises: Plank holds, Hollow body holds, Mountain climbers, and Deadbugs.";
        }

        // Nutrition, Diet, & Protein
        if (lower.includes('diet') || lower.includes('protein') || lower.includes('eat') || lower.includes('food') || lower.includes('meal') || lower.includes('nutrition')) {
          return "🥗 HIGH-EFFICIENCY NUTRITION PRINCIPLES:\n• Lean Proteins: Chicken breast, eggs/egg whites, Greek yogurt, canned tuna, tofu, and whey protein isolate.\n• Complex Carbs: Oats, sweet potatoes, brown rice, and quinoa for sustained workout energy.\n• Healthy Fats: Avocados, almonds, olive oil, and chia seeds for hormonal balance.\n👉 Pro Tip: For complete meal prep templates & cheat sheets, check out the FORGE30 E-Book!";
        }

        // Soreness, Pain, & Rest
        if (lower.includes('sore') || lower.includes('pain') || lower.includes('rest') || lower.includes('recover') || lower.includes('sleep')) {
          return "💤 RECOVERY & SORENESS STRATEGY:\n• DOMS (Delayed Onset Muscle Soreness): Normal when starting new stimuli. Light 15-minute active recovery or mobility stretches will promote blood flow and speed recovery.\n• Sharp/Joint Pain: STOP immediately. Joint pain indicates structural stress, not muscular adaptation.\n• Sleep Requirement: Target 7-9 hours of continuous sleep for human growth hormone (HGH) release and neural repair.";
        }

        // Motivation, Time Management, & Consistency
        if (lower.includes('time') || lower.includes('busy') || lower.includes('schedule') || lower.includes('motivat') || lower.includes('consistency') || lower.includes('habit')) {
          return "⏱ ZERO-FRICTION CONSISTENCY:\n• 15 minutes is only 1% of your entire 24-hour day.\n• Set a non-negotiable anchor time: Execute your session right after waking up or immediately upon returning home.\n• Never miss two days in a row: Maintaining momentum is easier than rebuilding momentum.";
        }

        // Plateau & Stagnation
        if (lower.includes('plateau') || lower.includes('stuck') || lower.includes('progress') || lower.includes('scale')) {
          return "⚡ BREAKING PROGRESS PLATEAUS:\n1. Alter Tempo: Use 4-second negative eccentric lowering reps.\n2. Reduce Rest Intervals: Drop rest times from 45 seconds to 20 seconds.\n3. Increase Density: Complete more rounds within the standard 15-minute window.\n4. Deload Week: Take 3-4 days of light mobility to let your central nervous system (CNS) reset.";
        }

        // Supplements
        if (lower.includes('supplement') || lower.includes('creatine') || lower.includes('whey') || lower.includes('preworkout') || lower.includes('vitamin')) {
          return "💊 EVIDENCE-BASED SUPPLEMENTATION:\n1. Creatine Monohydrate: 3-5g daily for power output and cell hydration.\n2. Whey/Plant Protein: Convenient way to hit daily protein targets.\n3. Vitamin D3 & Omega-3: Supports joint recovery, immune function, and test levels.\nNote: Supplements are 5% of your result—training intensity and solid nutrition make up the remaining 95%.";
        }

        return "🏋️ FORGE30 COACH RESPONSE:\nTo maximize your results: prioritize high movement quality, stay consistent with your 15-minute daily window, and ensure you consume adequate protein.\n\nFor custom step-by-step guidance, ask me about:\n- Fat loss vs Muscle gain\n- Exercise modifications (push-ups, squats, planks)\n- Nutrition & high-protein meal prep\n- Overcoming soreness & fatigue";
      };

      const handleSend = (e, textToSend) => {
        if (e) e.preventDefault();
        const query = textToSend || input;
        if (!query.trim()) return;

        setMessages((prev) => [...prev, { role: 'user', text: query }]);

        setIsTyping(true);

        setTimeout(() => {
          const reply = generateResponse(query);
          setMessages((prev) => [...prev, { role: 'assistant', text: reply }]);
          setIsTyping(false);
        }, 600);
      };

      return (

          </div>

          {/* Quick Prompt Suggestions */}
          <div className="flex flex-wrap gap-2 justify-center mb-4">
            {quickPrompts.map((prompt, i) => (
              <button
                key={i}
                onClick={() => handleSend(null, prompt)}
                className="text-[11px] bg-brand-black hover:bg-brand-card border border-brand-border text-slate-300 hover:text-brand-accent px-3 py-1.5 rounded-full transition"
              >

                <div className={`max-w-[88%] rounded border p-3.5 text-xs sm:text-sm leading-relaxed whitespace-pre-line ${
                  m.role === 'user' 
                    ? 'bg-brand-accent/20 border-brand-accent/40 text-slate-100 font-medium' 
                    : 'bg-brand-card border-brand-border text-slate-300'
                }`}>
                  {m.text}
                </div>
              </div>
            ))}
            {isTyping && (
              <div className="flex justify-start">
                <div className="bg-brand-card border border-brand-border text-slate-400 text-xs rounded p-3 italic">
                  FORGE30 AI Coach is formulating your fitness blueprint...
                </div>
              </div>
            )}
            <div ref={chatEndRef} />
          </div>

          <form onSubmit={(e) => handleSend(e, null)} className="flex gap-2">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Ask any fitness question (fat loss, push-ups, soreness, protein)..."

          </div>
        </div>
      );

          <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div className="flex flex-col items-center md:items-start gap-1">
              <div className="flex items-center gap-2 text-xl font-display font-bold text-white">
                FORGE<span className="text-brand-accent">30</span>
              </div>
              <a href={EBOOK_URL} target="_blank" rel="noopener noreferrer" className="text-xs text-brand-accent hover:underline font-bold">
                Download Official E-Book Guide →
              </a>
            </div>
            <p className="text-xs text-slate-500 text-center md:text-left">
              © {new Date().getFullYear()} FORGE30. Built for maximum efficiency and real home progression.
            </p>
            <div className="flex gap-6 text-xs text-slate-400">
              <a href={EBOOK_URL} target="_blank" rel="noopener noreferrer" className="hover:text-brand-accent transition font-bold">E-Book Link</a>
              <a href={SOCIAL_LINKS.tiktok} target="_blank" rel="noreferrer" className="hover:text-white transition">TikTok</a>
              <a href={SOCIAL_LINKS.youtube} target="_blank" rel="noreferrer" className="hover:text-white transition">YouTube</a>
              <a href={SOCIAL_LINKS.instagram} target="_blank" rel="noreferrer" className="hover:text-white transition">Instagram</a>
            </div>
          </div>
        </footer>
      );
    }

    function App() {
      const [isOnboardingOpen, setIsOnboardingOpen] = useState(false);
      const [userData, setUserData] = useState(() => {
        const saved = localStorage.getItem('forge30_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [completedDays, setCompletedDays] = useState(() => {
        const saved = localStorage.getItem('forge30_progress');
        return saved ? JSON.parse(saved) : [];
      });

      const [activeWorkout, setActiveWorkout] = useState(null);

      useEffect(() => {
        if (userData) {
          localStorage.setItem('forge30_user', JSON.stringify(userData));
        }
      }, [userData]);

      useEffect(() => {
        localStorage.setItem('forge30_progress', JSON.stringify(completedDays));
      }, [completedDays]);

      const handleCompleteWorkout = (dayNumber) => {
        if (!completedDays.includes(dayNumber)) {
          setCompletedDays([...completedDays, dayNumber]);
        }
        setActiveWorkout(null);
      };

      const handleOnboardingComplete = (formData) => {
        setUserData(formData);
        setIsOnboardingOpen(false);
        document.getElementById('dashboard')?.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen bg-brand-black text-slate-100 flex flex-col font-sans">
          <TopAnnouncementBar />
          <Header onOpenOnboarding={() => setIsOnboardingOpen(true)} userData={userData} />
          
          <main className="flex-grow">
            <HeroSection onStart={() => setIsOnboardingOpen(true)} />
            <ProblemSolution />
            <HowItWorks />
            
            <section id="dashboard" className="py-16 px-4 max-w-7xl mx-auto w-full">
              <Dashboard 
                userData={userData} 
                completedDays={completedDays}
                plan={DEFAULT_WORKOUT_PLAN}
                onSelectWorkout={(day) => setActiveWorkout(day)}
                onOpenOnboarding={() => setIsOnboardingOpen(true)}
              />
            </section>

            <section id="ai-coach" className="py-16 bg-brand-card/70 border-y border-brand-border px-4">
              <div className="max-w-4xl mx-auto">
                <AIAssistant />
              </div>
            </section>

            <section id="ebook" className="py-20 px-4">
              <EbookSection />
            </section>

            <SocialSection />
          </main>

          {isOnboardingOpen && (
            <OnboardingModal 
              onClose={() => setIsOnboardingOpen(false)} 
              onComplete={handleOnboardingComplete} 
            />
          )}

          {activeWorkout && (
            <WorkoutPlayer 
              workout={activeWorkout} 
              onClose={() => setActiveWorkout(null)}
              onComplete={() => handleCompleteWorkout(activeWorkout.day)}
            />
          )}

          <Footer />
          <StickyBottomEbookBar />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>

                <div 
                  key={item.day}
                  className={`bg-brand-card border ${isDone ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-brand-border'} p-5 rounded-lg flex flex-col justify-between hover:border-slate-600 transition`}
                >
                  <div>
                    <div className="flex justify-between items-center mb-3">
                      <span className="text-xs font-bold text-brand-accent uppercase tracking-wider">Day {item.day}</span>
                      <span className={`text-[10px] px-2 py-0.5 rounded uppercase font-bold border ${
                        item.isRest ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-brand-black text-slate-400 border-brand-border'
                      }`}>
                        {item.isRest ? 'Rest' : item.difficulty}
                      </span>
                    </div>
                    <h3 className="text-lg font-bold font-display tracking-tight text-white mb-2">{item.title}</h3>
                    <div className="flex items-center gap-4 text-xs text-slate-400 mb-4">
                      <span>⏱ {item.duration}</span>
                      <span>🔥 ~{item.estBurn}</span>
                    </div>
                  </div>

                  <div className="flex items-center justify-between border-t border-brand-border/60 pt-4 mt-2">
                    {isDone ? (
                      <span className="text-xs font-bold text-emerald-400 flex items-center gap-1">
                        ✓ Completed
                      </span>
                    ) : (
                      <span className="text-xs text-slate-500">
                        {item.exercises.length} Exercises
                      </span>
                    )}
                    
                    <button
                      onClick={() => onSelectWorkout(item)}
                      className={`px-3.5 py-1.5 rounded text-xs font-bold uppercase transition ${
                        isDone 
                          ? 'bg-brand-border text-slate-300 hover:bg-slate-700' 
                          : 'bg-brand-accent text-white hover:bg-brand-accentHover shadow-sm shadow-brand-accent/20'
                      }`}
                    >
                      {isDone ? 'Review' : 'Start Session'}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function WorkoutPlayer({ workout, onClose, onComplete }) {
      const [seconds, setSeconds] = useState(0);
      const [isActive, setIsActive] = useState(false);

      useEffect(() => {
        let interval = null;
        if (isActive) {
          interval = setInterval(() => {
            setSeconds((prev) => prev + 1);
          }, 1000);
        } else if (!isActive && seconds !== 0) {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isActive, seconds]);

      const formatTime = (totalSec) => {
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      return (
        <div className="fixed inset-0 z-50 bg-brand-black/95 backdrop-blur-md flex flex-col justify-between p-4 sm:p-8 overflow-y-auto">
          <div className="flex justify-between items-center border-b border-brand-border pb-4 max-w-4xl mx-auto w-full">
            <div>
              <span className="text-xs text-brand-accent font-bold uppercase">Day {workout.day} Guided Session</span>
              <h2 className="text-xl sm:text-2xl font-bold font-display">{workout.title}</h2>
            </div>
            <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl font-bold">✕</button>
          </div>

          <div className="max-w-3xl mx-auto w-full py-8 space-y-8">
            <div className="bg-brand-card border border-brand-border rounded-xl p-6 text-center shadow-2xl">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">Elapsed Session Time</span>
              <div className="text-5xl sm:text-6xl font-display font-bold text-white my-3 font-mono">{formatTime(seconds)}</div>
              <button
                onClick={() => setIsActive(!isActive)}
                className={`px-8 py-3 rounded font-bold uppercase text-xs tracking-wider transition ${
                  isActive ? 'bg-amber-600 hover:bg-amber-700 text-white' : 'bg-brand-accent hover:bg-brand-accentHover text-white'
                }`}
              >
                {isActive ? 'Pause Timer' : 'Start Timer'}
              </button>
            </div>

            <div className="space-y-4">
              <h3 className="text-lg font-display font-bold text-slate-300">EXERCISE SEQUENCE</h3>
              <div className="space-y-3">
                {workout.exercises.map((ex, idx) => (
                  <div key={idx} className="bg-brand-card border border-brand-border p-4 rounded-lg flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                    <div>
                      <h4 className="font-bold text-white text-base">{ex.name}</h4>
                      <p className="text-xs text-slate-400 mt-1">{ex.instructions}</p>
                    </div>
                    <div className="text-right shrink-0">
                      <span className="text-sm font-bold text-brand-accent">{ex.sets} Sets × {ex.reps}</span>
                      {ex.rest && <div className="text-[11px] text-slate-500">Rest: {ex.rest}</div>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="max-w-4xl mx-auto w-full border-t border-brand-border pt-4 flex justify-between items-center">
            <button onClick={onClose} className="text-slate-400 hover:text-white text-xs font-bold uppercase">
              Cancel
            </button>
            <button
              onClick={() => {
                onComplete(workout.day);
                onClose();
              }}
              className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold uppercase px-8 py-3.5 rounded text-xs tracking-wider transition shadow-lg"
            >
              Mark Session Complete ✓
            </button>
          </div>
        </div>
      );
    }

    // MAIN APP COMPONENT
    function App() {
      const [userData, setUserData] = useState(null);
      const [completedDays, setCompletedDays] = useState([]);
      const [selectedWorkout, setSelectedWorkout] = useState(null);
      const [showOnboarding, setShowOnboarding] = useState(false);

      useEffect(() => {
        const savedData = localStorage.getItem("forge30_user");
        const savedProgress = localStorage.getItem("forge30_progress");
        if (savedData) setUserData(JSON.parse(savedData));
        if (savedProgress) setCompletedDays(JSON.parse(savedProgress));
      }, []);

      const handleSaveUserData = (data) => {
        setUserData(data);
        localStorage.setItem("forge30_user", JSON.stringify(data));
        setShowOnboarding(false);
      };

      const handleCompleteWorkout = (day) => {
        if (!completedDays.includes(day)) {
          const updated = [...completedDays, day];
          setCompletedDays(updated);
          localStorage.setItem("forge30_progress", JSON.stringify(updated));
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-brand-black text-slate-100">
          <TopAnnouncementBar />
          <Header onOpenOnboarding={() => setShowOnboarding(true)} userData={userData} />

          <main className="flex-1">
            <HeroSection onStart={() => {
              const dashEl = document.getElementById("dashboard");
              if (dashEl) dashEl.scrollIntoView({ behavior: 'smooth' });
            }} />
            
            <ProblemSolution />
            <HowItWorks />

            <section id="dashboard" className="py-20 px-4 max-w-7xl mx-auto w-full border-t border-brand-border">
              <Dashboard 
                userData={userData}
                completedDays={completedDays}
                plan={DEFAULT_WORKOUT_PLAN}
                onSelectWorkout={(workout) => setSelectedWorkout(workout)}
                onOpenOnboarding={() => setShowOnboarding(true)}
              />
            </section>
          </main>

          <footer className="border-t border-brand-border bg-brand-black py-12 px-4">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
              <div>
                <p className="text-xl font-display font-bold">FORGE<span className="text-brand-accent">30</span></p>
                <p className="text-xs text-slate-500 mt-1">© 2026 FORGE30. High-Efficiency Fitness Protocols.</p>
              </div>
              <div className="flex gap-6 text-xs text-slate-400">
                <a href={SOCIAL_LINKS.tiktok} target="_blank" rel="noopener noreferrer" className="hover:text-brand-accent transition">TikTok</a>
                <a href={SOCIAL_LINKS.youtube} target="_blank" rel="noopener noreferrer" className="hover:text-brand-accent transition">YouTube</a>
                <a href={SOCIAL_LINKS.instagram} target="_blank" rel="noopener noreferrer" className="hover:text-brand-accent transition">Instagram</a>
                <a href={EBOOK_URL} target="_blank" rel="noopener noreferrer" className="hover:text-brand-accent transition font-bold text-brand-accent">Gumroad E-Book</a>
              </div>
            </div>
          </footer>

          {showOnboarding && (
            <OnboardingModal 
              onClose={() => setShowOnboarding(false)} 
              onComplete={handleSaveUserData} 
            />
          )}

          {selectedWorkout && (
            <WorkoutPlayer 
              workout={selectedWorkout} 
              onClose={() => setSelectedWorkout(null)} 
              onComplete={handleCompleteWorkout} 
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
